[package]
name = "acrobounced"
version = "0.1.0"
edition = "2024"
description = "Portable Windows process bouncer"
build = "build.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.winresource]
FileDescription = "AcroBounced portable process blocker"
ProductName = "AcroBounced"
OriginalFilename = "AcroBounced.exe"
